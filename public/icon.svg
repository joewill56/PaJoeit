<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#05102a" />
      <stop offset="55%" stop-color="#020614" />
      <stop offset="100%" stop-color="#01030a" />
    </radialGradient>

    <!-- Glass Squircle Outer Border Gradient -->
    <linearGradient id="squircle-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glass Squircle Inner Fill -->
    <linearGradient id="squircle-fill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#0b1b3a" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#061024" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#030816" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Rim Specular Reflection -->
    <linearGradient id="top-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- 3D P Main Ribbon Loop -->
    <linearGradient id="p-loop-grad" x1="15%" y1="10%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 3D P Left Stem Ribbon -->
    <linearGradient id="p-stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="80%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 3D P Bottom Fold Under -->
    <linearGradient id="p-bottom-fold" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Drop Shadow Filter for P Glyph -->
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#0284c7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Dark Background -->
  <rect width="1024" height="1024" fill="url(#bg-radial)" />

  <!-- Outer Glassmorphic Squircle (Centered) -->
  <g transform="translate(112, 112)">
    <!-- Squircle Shadow -->
    <rect x="0" y="8" width="800" height="800" rx="200" fill="#000000" opacity="0.6" filter="blur(20px)" />
    
    <!-- Squircle Body with Glowing Border -->
    <rect x="0" y="0" width="800" height="800" rx="200" fill="url(#squircle-fill)" stroke="url(#squircle-border)" stroke-width="12" />
    
    <!-- Inner Rim Highlight -->
    <rect x="12" y="12" width="776" height="776" rx="190" fill="none" stroke="url(#top-rim)" stroke-width="6" opacity="0.8" />
  </g>

  <!-- The 3D P Symbol with Pixels and Arrow -->
  <g filter="url(#p-glow)" transform="translate(112, 112)">
    <!-- 1. Left Vertical Stem (Ribbon fold) -->
    <path d="M 230 190 C 230 190, 270 170, 310 170 L 310 610 C 260 610, 230 550, 230 480 Z" fill="url(#p-stem-grad)" />

    <!-- 2. Main Outer P Loop (Fluid 3D curve) -->
    <path d="M 230 200 C 230 200, 380 150, 520 220 C 650 290, 640 460, 530 530 C 420 600, 310 570, 310 570 L 310 610 C 310 610, 430 620, 550 540 C 680 450, 670 270, 530 190 C 370 110, 230 170, 230 200 Z" fill="url(#p-loop-grad)" />

    <!-- 3. Lower Curve Tucking Back In -->
    <path d="M 310 470 C 310 580, 390 620, 390 620 C 390 620, 440 570, 440 500 C 440 430, 370 380, 310 470 Z" fill="url(#p-bottom-fold)" opacity="0.95" />

    <!-- 4. Deep Dark Counter Opening Inside P -->
    <path d="M 310 230 L 450 230 C 490 230, 530 260, 530 330 C 530 400, 490 430, 450 430 L 310 430 Z" fill="#040814" />

    <!-- 5. Four Cyan Digital Pixel Blocks (Cross formation) -->
    <!-- Pixel size: 38x38, corner-radius: 6 -->
    <!-- Top block -->
    <rect x="366" y="278" width="38" height="38" rx="7" fill="#00f0ff" />
    <!-- Left block -->
    <rect x="326" y="318" width="38" height="38" rx="7" fill="#00f0ff" />
    <!-- Center connection block -->
    <rect x="406" y="318" width="38" height="38" rx="7" fill="#00f0ff" />
    <!-- Bottom block -->
    <rect x="366" y="358" width="38" height="38" rx="7" fill="#00f0ff" />

    <!-- 6. Sharp Solid Pure White CONVERT Arrow (Pointing Right) -->
    <!-- Seamlessly emerging from the pixel blocks -->
    <path d="M 444 286 L 526 337 L 444 388 Z" fill="#ffffff" />
  </g>
</svg>