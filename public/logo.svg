<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="logo-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="p-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="p-grad-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#logo-bg)" />

  <!-- 3D P Icon with Arrow -->
  <g filter="url(#p-glow)" transform="translate(100, 20)">
    <!-- Main P outer curve -->
    <path d="M220 120 C 350 110, 480 160, 480 270 C 480 370, 360 410, 280 410 L 280 450 C 280 480, 220 490, 220 450 Z" fill="url(#p-grad-top)" />
    <!-- Left vertical folding ribbon -->
    <path d="M220 140 C 220 120, 260 120, 280 120 L 280 450 C 240 450, 220 400, 220 340 Z" fill="url(#p-grad-fold)" />
    <!-- Inner cutout -->
    <rect x="280" y="180" width="110" height="150" rx="36" fill="#050811" />
    <!-- Cyan Arrow -->
    <g transform="translate(295, 225)">
      <path d="M0 30 H 45 V 12 L 80 42 L 45 72 V 54 H 0 Z" fill="#38bdf8" />
    </g>
  </g>

  <!-- PAJOEIT Wordmark -->
  <text x="400" y="600" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="4">
    PAJOEIT
  </text>

  <!-- — CONVERT — Subtitle -->
  <g transform="translate(200, 640)">
    <line x1="0" y1="12" x2="60" y2="12" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <text x="200" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="34" fill="#38bdf8" letter-spacing="8">
      CONVERT
    </text>
    <line x1="340" y1="12" x2="400" y2="12" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
