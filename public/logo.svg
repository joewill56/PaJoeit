<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="logo-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071228" />
      <stop offset="100%" stop-color="#020612" />
    </radialGradient>

    <!-- 3D P Main Ribbon Loop -->
    <linearGradient id="logo-p-loop" x1="15%" y1="10%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 3D P Left Stem Ribbon -->
    <linearGradient id="logo-p-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="80%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 3D P Bottom Fold -->
    <linearGradient id="logo-p-bottom" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Text CONVERT Gradient -->
    <linearGradient id="convert-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Icon Glow -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1280" height="480" fill="url(#logo-bg)" rx="24" />

  <!-- Left Side: Official P Icon Symbol (Scaled) -->
  <g transform="translate(60, 48) scale(0.75)" filter="url(#logo-glow)">
    <!-- Stem -->
    <path d="M 80 80 C 80 80, 120 60, 160 60 L 160 440 C 110 440, 80 390, 80 320 Z" fill="url(#logo-p-stem)" />
    
    <!-- Outer Loop -->
    <path d="M 80 90 C 80 90, 230 40, 370 110 C 500 180, 490 350, 380 420 C 270 490, 160 460, 160 460 L 160 490 C 160 490, 280 500, 400 420 C 530 330, 520 150, 380 70 C 220 0, 80 60, 80 90 Z" fill="url(#logo-p-loop)" />
    
    <!-- Bottom tuck -->
    <path d="M 160 330 C 160 440, 240 480, 240 480 C 240 480, 290 430, 290 360 C 290 290, 220 240, 160 330 Z" fill="url(#logo-p-bottom)" opacity="0.95" />

    <!-- Dark counter opening -->
    <path d="M 160 120 L 290 120 C 330 120, 370 150, 370 220 C 370 290, 330 320, 290 320 L 160 320 Z" fill="#030814" />

    <!-- Pixels (Cyan) -->
    <rect x="216" y="168" width="34" height="34" rx="6" fill="#00f0ff" />
    <rect x="180" y="204" width="34" height="34" rx="6" fill="#00f0ff" />
    <rect x="252" y="204" width="34" height="34" rx="6" fill="#00f0ff" />
    <rect x="216" y="240" width="34" height="34" rx="6" fill="#00f0ff" />

    <!-- White Arrow -->
    <path d="M 288 176 L 360 221 L 288 266 Z" fill="#ffffff" />
  </g>

  <!-- Right Side: Brand Typography -->
  <!-- Top Word: PAJOEIT (Bold White) -->
  <text x="510" y="215" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="130" fill="#ffffff" letter-spacing="4">
    PAJOEIT
  </text>

  <!-- Bottom Word: CONVERT (Bold Cyan Gradient) -->
  <text x="510" y="375" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="135" fill="url(#convert-text-grad)" letter-spacing="2">
    CONVERT
  </text>
</svg>